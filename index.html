<html lang="id"><head><meta charset="utf-8">

<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#D8FF3E"><link rel="apple-touch-icon" href="icon-192.png"><title>Lucky Bienie – Kasir</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23D8FF3E'/%3E%3Cpath d='M8 12h16l-2 10H10z M12 17l3 3 5-6' stroke='%23222' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<style>
:root{--g:#D8FF3E;--gh:#BDEB24;--gs:#F4FFD1;--p:#FFB8DC;--ps:#F34FA6;--pb:#FFF0F7;--bg:#fff;--s2:#F7F7F7;--tx:#222;--t2:#777;--bd:#EAEAEA;--er:#D92D45;--ok:#27864A;--r:12px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--s2:#202020;--tx:#f2f2f2;--t2:#a0a0a0;--bd:#333;--gs:#2a3306;--pb:#33202b;--ok:#5ad083;--er:#ff6b7d}}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);height:100%}
#app{display:flex;height:100%}
nav{width:210px;border-right:1px solid var(--bd);padding:14px 10px;display:flex;flex-direction:column;gap:3px;background:var(--bg);flex:none;overflow:auto}
nav .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;padding:4px 8px 14px}
nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;display:flex;gap:10px;align-items:center;color:var(--tx)}
nav button:hover{background:var(--s2)}nav button.on{background:var(--g);color:#222;font-weight:700}
nav button i{width:8px;height:8px;border-radius:50%;background:var(--p);flex:none}nav button.on i{background:var(--ps)}
main{flex:1;overflow:auto;padding:18px;min-width:0}
h1{font-size:21px;margin:0 0 14px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:14px}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.k{font-size:12px;color:var(--t2)}.v{font-size:23px;font-weight:800;margin-top:2px}
.ca{border-top:4px solid var(--g)}.cb{border-top:4px solid var(--p)}
button.b,.b{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--g);color:#222}
.b:hover{background:var(--gh)}.b.s{background:var(--p)}.b.s:hover{background:#ff9fd0}.b.o{background:var(--bg);border:1px solid var(--bd);color:var(--tx)}.b.d{background:var(--er);color:#fff}.b:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);width:100%}
label{display:block;font-size:12px;color:var(--t2);margin:8px 0 3px}
table{width:100%;border-collapse:collapse}th{background:var(--s2);text-align:left;font-size:12px;color:var(--t2);padding:8px}td{padding:8px;border-top:1px solid var(--bd)}
tr.low td{background:var(--pb)}.tw{overflow-x:auto}
.bd{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;background:var(--pb);color:var(--ps);font-weight:700}.bd.e{background:#fde7ea;color:var(--er)}.bd.k{background:var(--gs);color:var(--ok)}
.pos{display:grid;grid-template-columns:1fr 360px;gap:14px;height:100%}.pl{overflow:auto}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.pc{border:1px solid var(--bd);border-radius:var(--r);padding:10px;cursor:pointer;background:var(--bg);text-align:left;font:inherit;color:var(--tx)}.pc:hover{border-color:var(--gh);background:var(--gs)}.pc b{display:block}.pc span{font-size:12px;color:var(--t2)}
.cart{display:flex;flex-direction:column;overflow:hidden}.ci{flex:1;overflow:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.tot{font-size:30px;font-weight:800}.pay{width:100%;padding:16px;font-size:18px}
.q{display:flex;gap:4px;align-items:center}.q button{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
.md{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.md>div{background:var(--bg);border-radius:16px;padding:18px;width:min(420px,100%);max-height:92%;overflow:auto}
.bars{display:flex;gap:8px;align-items:flex-end;height:130px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--t2)}.bars i{display:block;background:var(--g);border-top:3px solid var(--ps);border-radius:6px 6px 0 0;min-height:2px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99}
#rc{font:12px/1.4 "Courier New",monospace;color:#000;background:#fff;padding:10px}
@media(max-width:800px){#app{flex-direction:column-reverse}nav{width:100%;flex-direction:row;border:0;border-top:1px solid var(--bd);padding:6px;overflow-x:auto}nav .logo{display:none}nav button{flex:none;padding:8px 10px;font-size:13px}.pos{grid-template-columns:1fr;height:auto}}
@media print{body>*:not(#prt){display:none!important}#prt{display:block!important}}
#prt{display:none}
</style></head><body>
<div id="app"><nav id="nav"></nav><main id="main"></main></div><div id="prt"></div><div id="md"></div>
<script src="config.js"></script><script src="supabase.js"></script><script src="cloud.js"></script>
<script>
"use strict";
const K="lb_pos_v1",uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const rp=n=>"Rp"+Math.round(n).toLocaleString("id-ID"),$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dt=t=>new Date(t).toLocaleString("id-ID",{dateStyle:"short",timeStyle:"short"});
function seed(){const p=(name,sku,cat,cost,price,stock,min)=>({id:uid(),name,sku,cat,cost,price,stock,min,demo:1,active:1});
return{products:[p("Kopi Susu Botol","LB-001","Minuman",9000,15000,40,10),p("Teh Lemon","LB-002","Minuman",5000,9000,30,10),p("Roti Cokelat","LB-003","Roti",6000,11000,18,8),p("Keripik Singkong","LB-004","Snack",7000,12500,25,10),p("Mie Instan","LB-005","Sembako",2800,3500,100,30),p("Beras 5 kg","LB-006","Sembako",62000,72000,12,5)],sales:[],held:[],shifts:[],shift:null,cfg:{name:"Lucky Bienie",outlet:"Outlet Utama",tax:11,taxOn:false},n:0}}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S={...seed(),products:[]};S.sup=S.sup||[];S.cus=S.cus||[];S.buys=S.buys||[];S.exps=S.exps||[];S.pays=S.pays||[];S.mv=S.mv||[];S.rets=S.rets||[];S.users=S.users||[];S.audit=S.audit||[];S.lock=S.lock||{n:0,until:0};S.promos=S.promos||[];S.jm=S.jm||[];S.lp=S.lp||[];S.cfg.ptsPer=S.cfg.ptsPer||10000;
let cart=[],cdisc=0,view="dash",q="",busy=false,per="7";
try{cart=JSON.parse(localStorage.getItem(K+"_cart"))||[]}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(K+"_cart",JSON.stringify(cart))}catch(e){}CL.dirty()};
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}
function modal(h){$("#md").innerHTML=`<div class="md"><div>${h}</div></div>`}const close=()=>{$("#md").innerHTML="";CL.afterClose()};
const logo=`<svg width="30" height="30" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#D8FF3E"/><path d="M8 12h16l-2 10H10z" stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round"/><path d="M12.5 17l3 3 4.5-6" stroke="#F34FA6" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="25" cy="7" r="3" fill="#FFB8DC"/></svg>`;
const NAV=[["dash","Dashboard"],["pos","Kasir / POS"],["trx","Transaksi"],["buy","Pembelian"],["sup","Pemasok"],["cus","Pelanggan"],["promo","Promo &amp; loyalitas"],["ex","Pengeluaran"],["rep","Laporan"],["acc","Akuntansi"],["usr","Karyawan &amp; akses"],["test","Uji sistem"],["cons","Konsolidasi outlet"],["prod","Produk &amp; stok"],["shift","Kas &amp; shift"],["set","Pengaturan"]];
function nav(){$("#nav").style.display=ME?"":"none";$("#nav").innerHTML=`<div class="logo">${logo}<span>${esc(S.cfg.name)}</span></div>`+NAV.filter(([i])=>can(i)).map(([i,l])=>`<button class="${view===i?"on":""}" onclick="go('${i}')"><i></i>${l}</button>`).join("")+(ME?`<div style="flex:1"></div><div class="k" style="padding:6px 10px">${esc(ME.name)} · ${ME.role}</div><button onclick="pwm()"><i></i>Ganti password</button><button onclick="logout()"><i></i>Keluar</button>`:"")}
function go(v){if(!can(v)){toast("Anda tidak punya akses ke halaman ini");return}view=v;nav();({dash,pos,trx,prod,shift,set,buy:buyV,sup:()=>party("sup"),cus:()=>party("cus"),ex:exV,rep,usr,promo:promoV,test:testV,cons:consV,acc:accV}[v])()}
const inP=t=>{const s=new Date();s.setHours(0,0,0,0);const d=per==="all"?0:s.getTime()-(+per-1)*864e5;return t>=d};
/* DASHBOARD */
function dash(){const ss=S.sales.filter(s=>inP(s.ts)&&!s.void),tot=ss.reduce((a,s)=>a+s.total-(s.refunded?s.total:0),0),net=ss.filter(s=>!s.refunded).map(eff).filter(s=>s.items.length);
const n=net.length,cogs=net.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.cost*i.qty,0),0),gross=net.reduce((a,s)=>a+s.sub-s.disc,0)-cogs;
const top={};net.forEach(s=>s.items.forEach(i=>top[i.name]=(top[i.name]||0)+i.qty));const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
const low=S.products.filter(p=>p.active&&p.stock<=p.min);
const days=[...Array(7)].map((_,k)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+k);const a=d.getTime(),v=S.sales.filter(s=>!s.refunded&&s.ts>=a&&s.ts<a+864e5).reduce((x,s)=>x+eff(s).total,0);return[d.toLocaleDateString("id-ID",{weekday:"short"}),v]});const mx=Math.max(1,...days.map(d=>d[1]));
$("#main").innerHTML=`<h1>Halo, ${esc(S.cfg.name)} · ${esc(S.cfg.outlet)}</h1>${S.sales.length&&Date.now()-(S.cfg.lastBk||0)>6048e5?'<div class="card" style="border-left:4px solid var(--ps);margin-bottom:12px">Backup terakhir: '+(S.cfg.lastBk?dt(S.cfg.lastBk):"belum pernah")+'. Buka Pengaturan, lalu Backup &amp; restore.</div>':""}
<div style="margin-bottom:12px;max-width:200px"><select onchange="per=this.value;dash()">${[["1","Hari ini"],["7","7 hari"],["30","30 hari"],["all","Semua"]].map(([v,l])=>`<option value="${v}" ${per===v?"selected":""}>${l}</option>`).join("")}</select></div>
<div class="grid g4"><div class="card ca"><div class="k">Penjualan bersih</div><div class="v">${rp(net.reduce((a,s)=>a+s.total,0))}</div></div>
<div class="card cb"><div class="k">Transaksi</div><div class="v">${n}</div></div>
<div class="card ca"><div class="k">Rata-rata transaksi</div><div class="v">${rp(n?net.reduce((a,s)=>a+s.total,0)/n:0)}</div></div>
<div class="card cb"><div class="k">Laba kotor (sebelum pajak)</div><div class="v">${rp(gross)}</div></div></div><div class="grid g4" style="margin-top:12px"><div class="card"><div class="k">Pengeluaran</div><div class="v">${rp(expT())}</div></div><div class="card ca"><div class="k">Estimasi laba bersih</div><div class="v">${rp(gross-expT())}</div></div><div class="card cb"><div class="k">Piutang pelanggan</div><div class="v">${rp(arT())}</div></div><div class="card"><div class="k">Utang pemasok</div><div class="v">${rp(apT())}</div></div></div>
<div class="grid g2" style="margin-top:12px"><div class="card"><h2>Penjualan 7 hari</h2><div class="bars">${days.map(d=>`<div><i style="height:${Math.round(d[1]/mx*100)}px"></i>${d[0]}</div>`).join("")}</div></div>
<div class="card"><h2>Produk terlaris</h2>${tp.length?tp.map(([a,b])=>`<div class="row"><span>${esc(a)}</span><b>${b}</b></div>`).join(""):'<span class="k">Belum ada penjualan pada periode ini.</span>'}</div>
<div class="card"><h2>Stok rendah / habis</h2>${low.length?low.map(p=>`<div class="row"><span>${esc(p.name)}</span><span class="bd ${p.stock<=0?"e":""}">${p.stock<=0?"Habis":"Sisa "+p.stock}</span></div>`).join(""):'<span class="k">Semua stok aman.</span>'}</div>
<div class="card"><h2>Transaksi terbaru</h2>${S.sales.slice(-5).reverse().map(s=>`<div class="row"><span>${esc(s.no)}</span><b>${rp(s.total)}</b></div>`).join("")||'<span class="k">Belum ada transaksi.</span>'}</div></div>`}
/* POS */
function pos(){$("#main").innerHTML=`<div class="pos"><div class="pl"><div style="display:flex;gap:8px"><input id="sq" placeholder="Cari nama / SKU, atau scan barcode lalu Enter" autofocus><button class="b s" onclick="sq.focus()">Scan</button></div><div class="pg" id="pg"></div></div><div class="card cart" id="ct"></div></div>`;
$("#sq").oninput=e=>{q=e.target.value;lp()};$("#sq").onkeydown=e=>{if(e.key==="Enter"){const m=S.products.find(p=>p.active&&p.sku.toLowerCase()===q.trim().toLowerCase());if(m){add(m.id);q="";sq.value="";lp()}}};lp();rc()}
function lp(){const t=q.toLowerCase(),L=S.products.filter(p=>p.active&&(p.name.toLowerCase().includes(t)||p.sku.toLowerCase().includes(t)));
$("#pg").innerHTML=L.map(p=>`<button class="pc" onclick="add('${p.id}')"><b>${esc(p.name)}</b><span>${esc(p.sku)} · stok ${p.stock}</span><div style="margin-top:6px;font-weight:800">${rp(p.price)}</div></button>`).join("")||'<span class="k">Produk tidak ditemukan.</span>'}
function add(id){const p=S.products.find(x=>x.id===id);if(!p)return;const c=cart.find(x=>x.id===id),n=(c?c.qty:0)+1;if(n>p.stock){toast("Stok tidak mencukupi");return}c?c.qty=n:cart.push({id,qty:1});save();rc()}
function qty(id,d){const c=cart.find(x=>x.id===id),p=S.products.find(x=>x.id===id),n=c.qty+d;if(n>p.stock){toast("Stok tidak mencukupi");return}if(n<=0)cart=cart.filter(x=>x!==c);else c.qty=n;save();rc()}
function calc(){const sub=cart.reduce((a,c)=>{const p=S.products.find(x=>x.id===c.id);return a+p.price*c.qty},0),m0=Math.min(cdisc,sub),cd=cpn&&!cpErr(cpn)?cpV(cpn,sub-m0):0,pd=ccus?Math.min(Math.min(rdm,pbal(ccus))*100,Math.max(0,sub-m0-cd)):0,d=Math.min(m0+cd+pd,sub),tax=S.cfg.taxOn?Math.round((sub-d)*S.cfg.tax/100):0;return{sub,disc:d,cd,pd,pts:Math.ceil(pd/100),tax,total:sub-d+tax}}
function rc(){const T=calc();$("#ct").innerHTML=`<h2>Keranjang</h2><div class="ci">${cart.map(c=>{const p=S.products.find(x=>x.id===c.id);return`<div class="row"><div style="flex:1"><b>${esc(p.name)}</b><div class="k">${rp(p.price)}</div></div><div class="q"><button onclick="qty('${c.id}',-1)">−</button><b>${c.qty}</b><button onclick="qty('${c.id}',1)">+</button></div></div>`}).join("")||'<span class="k">Keranjang kosong.</span>'}</div>
<select onchange="ccus=this.value;rdm=0;rc()"><option value="">Pelanggan: Umum</option>${S.cus.map(c=>`<option value="${c.id}" ${ccus===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select><div style="display:flex;gap:6px;margin-top:6px"><input placeholder="Kode kupon" id="cpi" value="${cpn?esc(cpn.code):""}"><button class="b s" onclick="cpApply()">Pakai</button></div>${ccus?`<label>Tukar poin (saldo ${pbal(ccus)}, 1 poin = Rp100)</label><input type="number" min="0" max="${pbal(ccus)}" value="${rdm||""}" onchange="rdm=Math.max(0,Math.min(pbal(ccus),Math.floor(+this.value||0)));rc()">`:""}<label>Diskon transaksi (Rp)</label><input type="number" min="0" value="${cdisc||""}" onchange="cdisc=Math.max(0,+this.value||0);save();rc()">
<div class="row"><span>Subtotal</span><span>${rp(T.sub)}</span></div>${T.disc?`<div class="row"><span>Diskon${T.cd?" (kupon)":""}${T.pd?" (poin)":""}</span><span class="bd">−${rp(T.disc)}</span></div>`:""}${T.tax?`<div class="row"><span>PPN ${S.cfg.tax}%</span><span>${rp(T.tax)}</span></div>`:""}
<div class="tot">${rp(T.total)}</div><div style="display:flex;gap:6px;margin:8px 0"><button class="b s" style="flex:1" onclick="hold()" ${cart.length?"":"disabled"}>Tahan</button><button class="b o" style="flex:1" onclick="held()">Lanjut (${S.held.length})</button><button class="b o" onclick="if(cart.length&&confirm('Kosongkan keranjang?')){cart=[];cdisc=0;cpn=null;ccus="";rdm=0;save();rc()}">Batal</button></div>
<button class="b pay" onclick="payM()" ${cart.length?"":"disabled"}>Bayar</button>`}
function hold(){S.held.push({id:uid(),cart,cdisc,ts:Date.now()});cart=[];cdisc=0;cpn=null;ccus="";rdm=0;save();rc();toast("Transaksi ditahan")}
function held(){modal(`<h2>Transaksi ditahan</h2>${S.held.map(h=>`<div class="row"><span>${dt(h.ts)} · ${h.cart.length} item</span><button class="b" onclick="resume('${h.id}')">Buka</button></div>`).join("")||'<span class="k">Tidak ada.</span>'}<button class="b o" style="margin-top:10px" onclick="close()">Tutup</button>`)}
function resume(id){if(cart.length){toast("Kosongkan atau tahan keranjang saat ini dulu");return}const h=S.held.find(x=>x.id===id);cart=h.cart;cdisc=h.cdisc;S.held=S.held.filter(x=>x!==h);save();close();rc()}
let payId=null;
function payM(){if(!S.shift){modal(`<h2>Shift belum dibuka</h2><p>Buka shift kasir terlebih dahulu agar kas tercatat.</p><button class="b" onclick="close();go('shift')">Buka shift</button> <button class="b o" onclick="close()">Tutup</button>`);return}
const T=calc();payId=uid();modal(`<h2>Pembayaran</h2><div class="tot">${rp(T.total)}</div><div class="k">Pelanggan: ${esc((S.cus.find(c=>c.id===ccus)||{name:"Umum"}).name)}</div><label>Metode</label><select id="pm" onchange="pmc()"><option>Tunai</option><option>QRIS</option><option>Transfer</option><option>Kartu</option><option>Piutang</option></select>
<div id="pn"><label>Uang diterima</label><input id="pa" type="number" min="0" value="${T.total}" oninput="pmc()"><div id="chg" class="k" style="margin-top:6px"></div></div>
<div style="display:flex;gap:8px;margin-top:14px"><button class="b o" onclick="close()">Kembali</button><button class="b" id="pb" style="flex:1" onclick="chk()">Konfirmasi bayar</button></div>`);pmc()}
function pmc(){const T=calc(),m=$("#pm").value;if(m==="Tunai"){$("#pa").style.display="";const a=+$("#pa").value||0;$("#chg").textContent=a>=T.total?"Kembalian: "+rp(a-T.total):"Uang kurang "+rp(T.total-a);$("#pb").disabled=a<T.total}else if(m==="Piutang"){$("#pa").style.display="none";$("#chg").textContent="Dicatat sebagai piutang pelanggan (wajib pilih pelanggan).";$("#pb").disabled=false}else{$("#pa").style.display="none";$("#chg").innerHTML="Konfirmasi manual oleh kasir. <b>Belum terhubung provider pembayaran</b> (mode manual).";$("#pb").disabled=false}}
let chkB=false;
async function chk(){if(busy||chkB)return;chkB=true;const b=$("#pb");if(b)b.disabled=true;try{await CL.syncN()}catch(e){}chkB=false;checkout()}
function checkout(){if(busy)return;busy=true;try{
if(S.sales.some(s=>s.id===payId)){close();return}
const T=calc(),m=$("#pm").value,cu=ccus||"",paid=m==="Tunai"?+$("#pa").value:m==="Piutang"?0:T.total;if(m==="Piutang"&&!cu)throw new Error("Pilih pelanggan untuk piutang");

function psv(k,id){const o={name:$("#p1").value.trim(),phone:$("#p2").value.trim(),address:$("#p3").value.trim()};if(!o.name)return toast("Nama wajib diisi");if(id)Object.assign(S[k].find(y=>y.id===id),o);else S[k].push({id:uid(),...o});save();close();party(k)}
function pp(k,id){const d=bal(k,id);modal(`<h2>${k==="cus"?"Terima pembayaran piutang":"Bayar utang"}</h2><div class="k">Sisa</div><div class="v">${rp(d)}</div>${ask("Jumlah (Rp)","pa2","number",d)}<label>Metode</label><select id="pm2"><option>Tunai</option><option>Transfer</option></select><div style="display:flex;gap:8px;margin-top:14px"><button class="b" style="flex:1" onclick="psv2('${k}','${id}')">Simpan</button><button class="b o" onclick="close()">Batal</button></div>`)}
function psv2(k,id){const a=Math.round(+$("#pa2").value),m=$("#pm2").value,d=bal(k,id);if(!(a>0&&a<=d))return toast("Jumlah harus 1 s/d "+rp(d));if(m==="Tunai"&&!S.shift)return toast("Buka shift dulu untuk pembayaran tunai");S.pays.push({id:uid(),k,pid:id,amt:a,method:m,ts:Date.now(),shiftId:S.shift?S.shift.id:null});save();close();party(k);toast("Pembayaran dicatat")}
let bl=[],bs="",bmo="Tunai";
function buyV(){$("#main").innerHTML=`<h1>Pembelian</h1><button class="b" onclick="bl=[];bm()">+ Buat pembelian</button><div class="card tw" style="margin-top:10px"><table><tr><th>No</th><th>Tanggal</th><th>Pemasok</th><th>Total</th><th>Status</th><th></th></tr>${S.buys.slice().reverse().map(b=>`<tr><td>${b.no}</td><td>${dt(b.ts)}</td><td>${esc((S.sup.find(s=>s.id===b.sup)||{}).name)}</td><td>${rp(b.total)}${b.credit?' <span class="bd">Kredit</span>':""}</td><td><span class="bd ${b.st==="Diterima"?"k":b.st==="Batal"?"e":""}">${b.st}</span></td><td>${b.st==="Draft"?`<button class="b" onclick="brecv('${b.id}')">Terima barang</button> <button class="b o" onclick="bcan('${b.id}')">Batal</button>`:""}</td></tr>`).join("")||'<tr><td colspan="6" class="k">Belum ada pembelian.</td></tr>'}</table></div>`}
function bm(){const tot=bl.reduce((a,l)=>a+l.q*l.c,0);if(!S.sup.length){modal(`<h2>Belum ada pemasok</h2><p>Tambahkan pemasok dulu di menu Pemasok.</p><button class="b o" onclick="close()">Tutup</button>`);return}modal(`<h2>Pembelian baru</h2><label>Pemasok</label><select id="bs"><option value="">— pilih —</option>${S.sup.map(s=>`<option value="${s.id}" ${bs===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select><label>Pembayaran</label><select id="bmo"><option ${bmo==="Tunai"?"selected":""}>Tunai</option><option ${bmo==="Kredit"?"selected":""}>Kredit</option></select><label>Produk</label><select id="bp" onchange="$('#bc').value=S.products.find(p=>p.id===this.value).cost">${S.products.filter(p=>p.active).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select><div style="display:flex;gap:8px"><div style="flex:1"><label>Jumlah</label><input id="bq" type="number" min="1" value="1"></div><div style="flex:1"><label>Harga beli</label><input id="bc" type="number" min="0"></div></div><button class="b s" style="margin-top:8px" onclick="badd()">Tambah baris</button>${bl.map((l,i)=>`<div class="row"><span>${esc(l.n)} × ${l.q}</span><span>${rp(l.q*l.c)} <button class="b o" onclick="bl.splice(${i},1);bm()">×</button></span></div>`).join("")}<div class="row"><b>Total</b><b>${rp(tot)}</b></div><div style="display:flex;gap:8px;margin-top:12px"><button class="b" style="flex:1" onclick="bsv()">Simpan draft</button><button class="b o" onclick="close()">Batal</button></div>`);setTimeout(()=>{const p=S.products.find(x=>x.active);if(p&&$("#bc"))$("#bc").value=p.cost},0)}
function badd(){bs=$("#bs").value;bmo=$("#bmo").value;const p=S.products.find(x=>x.id===$("#bp").value),q=Math.floor(+$("#bq").value),c=+$("#bc").value;if(!p||!(q>0)||!(c>=0)||$("#bc").value==="")return toast("Isi produk, jumlah, dan harga");bl.push({pid:p.id,n:p.name,q,c});bm()}
function bsv(){bs=$("#bs").value;bmo=$("#bmo").value;if(!bs)return toast("Pilih pemasok");if(!bl.length)return toast("Tambahkan minimal satu baris");S.pn=(S.pn||0)+1;S.buys.push({id:uid(),no:"PO-"+String(S.pn).padStart(4,"0"),ts:Date.now(),sup:bs,lines:bl,total:bl.reduce((a,l)=>a+l.q*l.c,0),credit:bmo==="Kredit",st:"Draft"});bl=[];save();close();buyV()}
function brecv(id){const b=S.buys.find(x=>x.id===id);if(!b||b.st!=="Draft")return;b.lines.forEach(l=>{const p=S.products.find(x=>x.id===l.pid);p.cost=Math.round((p.stock*p.cost+l.q*l.c)/(p.stock+l.q));p.stock+=l.q;mv(p.id,l.q,"Pembelian",b.no)});b.st="Diterima";b.rts=Date.now();log("Terima barang",b.no);save();buyV();toast("Stok bertambah")}
function bcan(id){const b=S.buys.find(x=>x.id===id);if(b&&b.st==="Draft"&&confirm("Batalkan pembelian?")){b.st="Batal";save();buyV()}}
function exV(){$("#main").innerHTML=`<h1>Pengeluaran</h1><button class="b" onclick="exf()">+ Catat pengeluaran</button><div class="card tw" style="margin-top:10px"><table><tr><th>Tanggal</th><th>Kategori</th><th>Catatan</th><th>Metode</th><th>Jumlah</th></tr>${S.exps.slice().reverse().map(e=>`<tr><td>${dt(e.ts)}</td><td><span class="bd">${esc(e.cat)}</span></td><td>${esc(e.note)}</td><td>${e.method}</td><td>${rp(e.amt)}</td></tr>`).join("")||'<tr><td colspan="5" class="k">Belum ada pengeluaran.</td></tr>'}</table></div>`}
function exf(){modal(`<h2>Catat pengeluaran</h2><label>Kategori</label><select id="e1">${["Sewa","Gaji","Listrik dan air","Transportasi","Lainnya"].map(c=>`<option>${c}</option>`).join("")}</select>${ask("Catatan","e2")}${ask("Jumlah (Rp)","e3","number")}<label>Metode</label><select id="e4"><option>Tunai</option><option>Transfer</option></select><div style="display:flex;gap:8px;margin-top:14px"><button class="b" style="flex:1" onclick="exs()">Simpan</button><button class="b o" onclick="close()">Batal</button></div>`)}
function exs(){const a=Math.round(+$("#e3").value),m=$("#e4").value;if(!(a>0))return toast("Jumlah harus lebih dari 0");if(m==="Tunai"&&!S.shift)return toast("Buka shift dulu untuk pengeluaran tunai");S.exps.push({id:uid(),ts:Date.now(),cat:$("#e1").value,note:$("#e2").value.trim(),amt:a,method:m,shiftId:S.shift?S.shift.id:null});log("Pengeluaran",$("#e1").value+" "+rp(a));save();close();exV()}
addEventListener("keydown",e=>{if(e.key==="F2"&&view==="pos"){e.preventDefault();$("#sq")?.focus()}});
gate();
</script><script>if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(function(){});</script></body></html>
